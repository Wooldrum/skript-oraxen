import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'com.gradleup.shadow' version '8.3.0'
    id 'eclipse'
    id 'java'
}

compileJava {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

group = 'me.Asleepp'
version = '1.1'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }

    // Skript
    maven {
        name = "Skript"
        url = 'https://repo.skriptlang.org/releases'
    }
    // Oraxen
    maven {
        name = "Oraxen"
        url = "https://repo.oraxen.com/releases"

    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT"
    compileOnly (group: 'com.github.SkriptLang', name: 'Skript', version: '2.13.2') {
        transitive = false
    }
    compileOnly 'io.th0rgal:oraxen:1.198.0'
    implementation 'org.bstats:bstats-bukkit:3.0.2'
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

build {
    dependsOn(shadowJar)
    tasks.withType(JavaCompile).tap {
        configureEach {
            options.compilerArgs.add("-Xlint:unchecked")
            options.compilerArgs.add("-Xlint:deprecation")
        }
    }
}

processResources {
    filter ReplaceTokens, tokens: ["version": project.version]
}


shadowJar {
    relocate 'org.bstats', 'me.asleepp.skriptoraxen.bstats'
    archiveVersion = project.property("version")
}